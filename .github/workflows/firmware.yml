name: Firmware

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Add llvm-tools (required for cargo objcopy)
        run: rustup component add llvm-tools

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-make, linker, and UF2 tools
        run: |
          cargo install cargo-make flip-link cargo-binutils cargo-hex-to-uf2

      - name: Build UF2 firmware
        run: cargo make uf2 --release

      - name: Upload UF2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: corne-rmk-uf2
          path: |
            corne-rmk-central.uf2
            corne-rmk-peripheral.uf2
