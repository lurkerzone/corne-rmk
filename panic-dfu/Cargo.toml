[package]
name = "corne-panic-dfu"
version = "0.1.0"
edition = "2024"
description = "no_std panic handler that reboots into the Adafruit nRF52 UF2 bootloader"
license = "MIT OR Apache-2.0"

[lib]
# Named `panic_probe` when imported so the code generated by rmk's
# `#[rmk_central]` / `#[rmk_peripheral]` macros -- which unconditionally does
# `use panic_probe as _;` -- picks up this crate's `#[panic_handler]` at link
# time. See the parent Cargo.toml `[dependencies]` for the package rename.
name = "corne_panic_dfu"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
