# Corne (foostan 6-column) on nice!nano-class nRF52840 boards.
# Matrix pins match ZMK shield `corne` + `nice_nano` pro_micro mapping:
#   https://github.com/zmkfirmware/zmk/tree/main/app/boards/shields/corne
#   https://github.com/zmkfirmware/zmk/tree/main/app/module/boards/nicekeyboards/nice_nano
#
# Left half = central (USB host side). Right half = peripheral.
# If your halves are swapped, swap which device you flash with `central` vs `peripheral`.
#
# For a second Corne in the same home, change `ble_addr` on BOTH halves to a new unique pair.

[keyboard]
name = "Corne RMK"
product_name = "Corne RMK"
vendor_id = 0x4c4b
product_id = 0x636f
manufacturer = "corne-rmk"
chip = "nrf52840"

[layout]
rows = 4
cols = 12
layers = 4
keymap = [
  # Layer 0 — default (aligned with ZMK `corne` default_layer)
  [
    ["Tab", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "Backspace"],
    ["LCtrl", "A", "S", "D", "F", "G", "H", "J", "K", "L", "Semicolon", "Quote"],
    ["LShift", "Z", "X", "C", "V", "B", "N", "M", "Comma", "Dot", "Slash", "Escape"],
    ["_", "_", "_", "LGui", "MO(1)", "Space", "Enter", "MO(2)", "RAlt", "_", "_", "_"],
  ],
  # Layer 1 — lower (numbers + arrows; add Bluetooth actions via Vial custom keys if needed)
  [
    ["Tab", "Kc1", "Kc2", "Kc3", "Kc4", "Kc5", "Kc6", "Kc7", "Kc8", "Kc9", "Kc0", "Backspace"],
    ["LCtrl", "_", "_", "_", "_", "_", "Left", "Down", "Up", "Right", "_", "_"],
    ["LShift", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
    ["_", "_", "_", "LGui", "_", "Space", "Enter", "_", "RAlt", "_", "_", "_"],
  ],
  # Layer 2 — raise (US shifted number row / symbols; matches ZMK raise intent)
  [
    ["Tab", "SHIFTED(Kc1)", "SHIFTED(Kc2)", "SHIFTED(Kc3)", "SHIFTED(Kc4)", "SHIFTED(Kc5)", "SHIFTED(Kc6)", "SHIFTED(Kc7)", "SHIFTED(Kc8)", "SHIFTED(Kc9)", "SHIFTED(Kc0)", "Backspace"],
    ["LCtrl", "_", "_", "_", "_", "_", "Minus", "Equal", "LeftBracket", "RightBracket", "Backslash", "Grave"],
    ["LShift", "_", "_", "_", "_", "_", "SHIFTED(Minus)", "SHIFTED(Equal)", "SHIFTED(LeftBracket)", "SHIFTED(RightBracket)", "SHIFTED(Backslash)", "SHIFTED(Grave)"],
    ["_", "_", "_", "LGui", "_", "Space", "Enter", "MO(3)", "RAlt", "_", "_", "_"],
  ],
  # Layer 3 — fourth layer (empty by default; edit in Vial). Hold Raise, then hold the key between Enter and RAlt to use MO(3).
  [
    ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
  ],
]

# Hold these keys (matrix row, col on the 4×12 map) while Vial runs “Unlock” — required because RMK enables `vial_lock` by default.
# Default-layer left thumb: LGui (3,3) + Lower (3,4). Change if your keymap moves them.
[host]
unlock_keys = [[3, 3], [3, 4]]

# One-time factory reset: uncomment the next line, build, flash central (and peripheral), boot once, then comment out and flash again.
[storage]
# clear_storage = true

[ble]
enabled = true
#
# Battery reporting over BLE (Battery Service / BAS).
# Some RMK revisions only read battery config from the top-level `[ble]` section.
# Keep these values in sync with the split-central/peripheral settings below.
battery_adc_pin = "vddh"
adc_divider_measured = 2000
adc_divider_total = 2806

[split]
connection = "ble"

# Left half — column order pro_micro 21,20,19,18,15,14 → P0_31,P0_29,P0_02,P1_15,P1_13,P1_11
[split.central]
rows = 4
cols = 6
row_offset = 0
col_offset = 0
ble_addr = [0x18, 0xe2, 0x21, 0x80, 0xc0, 0xc7]
battery_adc_pin = "vddh"
adc_divider_measured = 2000
adc_divider_total = 2806

[split.central.matrix]
matrix_type = "normal"
row_pins = ["P0_22", "P0_24", "P1_00", "P0_11"]
col_pins = ["P0_31", "P0_29", "P0_02", "P1_15", "P1_13", "P1_11"]

# Right half — column order pro_micro 14,15,18,19,20,21 → P1_11,P1_13,P1_15,P0_02,P0_29,P0_31
[[split.peripheral]]
rows = 4
cols = 6
row_offset = 0
col_offset = 6
ble_addr = [0x7e, 0xfe, 0x73, 0x9e, 0x66, 0xe3]
battery_adc_pin = "vddh"
adc_divider_measured = 2000
adc_divider_total = 2806

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_22", "P0_24", "P1_00", "P0_11"]
col_pins = ["P1_11", "P1_13", "P1_15", "P0_02", "P0_29", "P0_31"]
