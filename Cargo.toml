[package]
name = "corne-rmk"
version = "0.1.0"
description = "RMK firmware for wireless Corne (nRF52840 / nice!nano-class boards)"
repository = "https://github.com/HaoboGu/rmk"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
# Vendored rmk-rs/rmk @ f8da274 (PR #1038 / issue #710: split battery GATT).
# Local patch: Vial is USB-only — the extra BLE HID service is stripped so
# macOS binds the real keyboard HID service. See vendor/README.md.
# `watchdog` stays off.
rmk = { path = "vendor/rmk", default-features = false, features = [
    "defmt",
    "storage",
    "vial",
    "host_lock",
    "nrf52840_ble",
    "split",
    "async_matrix",
    "adafruit_bl",
    "use_1m_phy",
] }
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "f54b6389ffa2750d4d3a4f5435660cb66b47e51a", features = [
    "defmt",
    "peripheral",
    "central",
    "nrf52840",
] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "f54b6389ffa2750d4d3a4f5435660cb66b47e51a", features = [
    "defmt",
    "critical-section-impl",
    "nrf52840",
] }
bt-hci = { version = "0.9", features = ["defmt"] }

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", features = [
    "defmt",
    "nrf52840",
    "time-driver-rtc1",
    "gpiote",
    "unstable-pac",
    "nfc-pins-as-gpio",
    "time",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
defmt = "1"
defmt-rtt = "1"
# The macro-generated `use panic_probe as _;` still needs to resolve, so we keep
# the *import name* `panic_probe` alive but swap the crate behind it for a tiny
# local shim (`panic-dfu/`). The shim's `#[panic_handler]` writes
# `DFU_MAGIC_UF2_RESET` (0x57) to `NRF_POWER->GPREGRET` and does `sys_reset()`,
# so any panic reboots into the Adafruit UF2 bootloader instead of stalling in
# a silent HardFault (which is what stock `panic-probe` does when `print-defmt`
# is disabled, and which leaves the device looking bricked with no USB / no BT
# / no NICENANO volume). See `panic-dfu/src/lib.rs`.
panic-probe = { package = "corne-panic-dfu", path = "panic-dfu" }
static_cell = "2"

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

[[bin]]
name = "central"
path = "src/central.rs"

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"

# Explicit workspace so cargo doesn't complain about the `panic-dfu/` path dep
# being an implicit workspace member, and so `cargo build` at the root only
# builds the firmware (the shim is pulled in as a normal dependency).
[workspace]
resolver = "2"
members = ["panic-dfu"]
